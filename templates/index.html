<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <meta http-equiv="refresh" content="2">
    <style>
        *{box-sizing:border-box;}
        body{
            font-family: Arial;
            background:#111827;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            margin:0;
        }
        .card{
            background:#1f2937;
            padding:30px;
            border-radius:12px;
            width:520px;
            max-width:90%;
        }
        h1{margin-top:0;}
        p{font-size:18px;}
        .value{color:#22c55e;}
        .message{color:#93c5fd;}
    </style>
</head>
<body>
<div class="card">
    <h1>{{ title }}</h1>
    <p class="message">{{ message }}</p>

    <p>Container: <span class="value">{{ hostname }}</span></p>
    <p>IP: <span class="value">{{ ip }}</span></p>
    <p>Version: <span class="value">{{ version }}</span></p>
    <p>Environment: <span class="value">{{ environment }}</span></p>
    <p>Owner: <span class="value">{{ owner }}</span></p>
    <p>AWS Region: <span class="value">{{ aws_region }}</span></p>
    <p>Time: <span class="value">{{ time }}</span></p>
</div>
</body>
</html>
